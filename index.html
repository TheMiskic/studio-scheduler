<!doctype html>
<html lang="sr-Latn-RS">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalendar termina</title>
<meta name="description" content="Kalendar termina studija.">
<link rel="stylesheet" href="assets/style.css?v=4">
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <h1 id="studio-name">Studio</h1>
    <span class="sub" id="hours-summary"></span>
  </header>
  <p class="hours-note" id="tz-note"></p>

  <div class="msg error" id="load-error" hidden></div>

  <section class="panel">
    <div class="cal-toolbar">
      <button type="button" id="prev-month" aria-label="Prethodni mesec">&lsaquo;</button>
      <button type="button" id="this-month">Danas</button>
      <div class="cal-title" id="cal-title" aria-live="polite"></div>
      <button type="button" class="small" id="export-ics">.ics</button>
      <button type="button" id="next-month" aria-label="Sledeći mesec">&rsaquo;</button>
    </div>
    <div class="cal-grid" id="cal-head" aria-hidden="true"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </section>

  <section class="panel" id="day-panel" hidden>
    <h2 id="day-title"></h2>
    <p class="day-window" id="day-window"></p>
    <ul class="slot-list" id="day-slots"></ul>
    <p class="empty" id="day-empty" hidden>Nema termina za ovaj dan.</p>
    <div id="day-free"></div>
  </section>

  <footer class="site-footer">
    <a id="contact-link" hidden></a>
    <span id="updated-note"></span>
    <a href="admin.html">Administracija</a>
  </footer>

</div>
<script src="assets/common.js?v=4"></script>
<script src="assets/app.js?v=4"></script>
</body>
</html>
